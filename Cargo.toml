[package]
name = "bevy_composable_dragging"
version = "0.3.9" # Must always aligned with bevy_gradmesh. Don't forget to update README.md and book/
authors = ["Jessica Collins (https://github.com/xenacool)"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Declarative, composable dragging for Bevy, ported from Dragology"
repository = "https://github.com/xenacool/bevy_composable_dragging"
readme = "README.md"
exclude = ["screenshots/", "reference/", "target/", "Cargo.lock", "Makefile", "book/"]

[profile.dev]
codegen-units = 8

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# Bevy example binaries exceed the macOS linker's compact unwind table limit; the message is harmless.
linker_messages = "allow"
# No `unsafe` anywhere in the library, the examples or the tests, and no `allow` can lift this.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
# Bevy system parameters (`Res`, `Query`, ...) are always taken by value.
needless_pass_by_value = "allow"
# Layout code converts small indices to floats all the time.
cast_precision_loss = "allow"

[features]
default = []
# PBR materials and mesh picking backend for 3D scenes.
pbr = ["bevy/bevy_pbr", "bevy/mesh_picking"]
# Any `bevy_gradmesh` shape as node geometry (`Geometry::Grad`).
gradmesh = ["dep:bevy_gradmesh", "pbr", "bevy/bevy_text"]
# Flat gradient shapes from `bevy_gradmesh` for 2D scenes (`Rendering::Flat` with a `Camera2d`).
shapes-2d = ["gradmesh"]
# Gradient shapes from `bevy_gradmesh` for 3D scenes.
shapes-3d = ["gradmesh"]
# Property-based fuzz tests for the physics lab example (slow — not in default test runs).
fuzz = []
# Editable heightmap terrain for the kart racer editor and similar examples.
basic-terrain = []
# A graph in which equal nodes are one node, to describe documents, materials, terrain and
# particles that share what is equal and keep sharing it when they are rewritten.
shared-graph = []

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_color", "bevy_scene"] }
bevy_gradmesh = { version = "0.3.9", optional = true }

# Examples need windowing, tonemapping LUT textures and PNG support which the library does not require.
[dev-dependencies]
bevy = { version = "0.20", features = ["bevy_pbr", "mesh_picking", "tonemapping_luts", "png"] }
# Colliders and rigid bodies for the examples and the physics tests. Avian reads meshes only, so
# the headless tests need no GPU.
avian2d = { version = "0.8", default-features = false, features = ["2d", "parry-f32", "parallel"] }
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "collider-from-mesh", "parallel"] }
# Reads the particle schema that the shared graph tests describe documents with.
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# Property-based testing for drag interaction correctness.
proptest = "1"

